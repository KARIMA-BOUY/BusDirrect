<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=c, initial-scale=1.0">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
     <script type="module" src="/src/main.js"></script>
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Document</title>
</head>
<body>
  <header class="bg-white text-slate-800 border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="flex items-center space-x-4">
          <div class="bg-indigo-900 text-amber-400 p-3 rounded-xl shadow-md">
            <i class="fa-solid fa-bus text-2xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-black text-indigo-950 tracking-wide">BusDirect</h1>
            <div class="flex items-center space-x-2 text-slate-600 text-sm font-medium">
              <span class="font-bold text-slate-800">Safi</span>
              <i class="fa-solid fa-arrow-right text-xs text-amber-500"></i>
              <span class="font-bold text-slate-800">Marrakech</span>
              <span class="bg-amber-100 text-amber-800 font-semibold text-xs px-2.5 py-0.5 rounded-full border border-amber-300 ml-2"> 80 DH / place</span>
            </div>
          </div>
        </div>
        <div class="flex items-center justify-between md:justify-end space-x-4 border-t md:border-t-0 border-slate-100 pt-3 md:pt-0">
          <div class="flex space-x-3 text-sm">
            <div class="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-inner">
              <span class="text-slate-500 text-xs block">Places Libres</span>
              <span class="font-extrabold text-emerald-600 text-base" id="header-available-count">20 / 20</span>
            </div>
            <div class="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-inner">
              <span class="text-slate-500 text-xs block">Recette Totale</span>
              <span class="font-extrabold text-amber-600 text-base" id="header-total-revenue">0 DH</span>
            </div>
          </div>
          <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button id="nav-booking" onclick="switchTab('booking')" class="px-4 py-2 text-sm font-bold rounded-lg transition-all bg-indigo-900 text-white shadow-sm flex items-center gap-2">
              <i class="fa-solid fa-chair text-amber-400"></i>
              <span class="hidden sm:inline">Réservations</span>
            </button>
            <button id="nav-tickets" onclick="switchTab('tickets')" class="px-4 py-2 text-sm font-bold rounded-lg transition-all text-slate-600 hover:text-indigo-900 flex items-center gap-2">
              <i class="fa-solid fa-ticket"></i>
              <span class="hidden sm:inline">Billets</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
